name: Build Docker and Standalone App

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and test client
        run: |
          node scripts/build-client.js
          cd src
          npm ci --ignore-scripts
          npm test

      - name: Validate Compose installation
        run: docker compose config --quiet

      - name: Verify release version and notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const p=require("./src/package.json");if(process.env.RELEASE_TAG!=="v"+p.version)throw new Error("Release tag must match package.json version");'
          test -f "docs/releases/$RELEASE_TAG.md"

      - name: Package standalone client
        run: python scripts/package-standalone.py

      - name: Upload standalone download
        uses: actions/upload-artifact@v4
        with:
          name: retirement-calculator-standalone
          path: |
            dist/retirement-calculator-standalone.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: retirement-calculator-standalone
          path: dist
      - name: Verify download checksum
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; leaving published assets unchanged."
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Retirement Calculator ${RELEASE_TAG#v}" \
              --notes-file "docs/releases/$RELEASE_TAG.md" \
              dist/retirement-calculator-standalone.zip dist/SHA256SUMS.txt
          fi
