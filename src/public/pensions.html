<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="./runtime-config.js"></script><script src="./theme.js"></script><script src="./plan-schema.js"></script><script src="./browser-store.js"></script><script src="./storage.js"></script><script src="./worker-bundle.js"></script><script src="./workers.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pensions · Retirement</title>
<style>
  :root{--bg:#0b1329;--panel:#16223f;--panel2:#0f172a;--accent:#38bdf8;--green:#22c55e;--danger:#ef4444;--text:#f8fafc;--muted:#94a3b8;--line:rgba(255,255,255,.06)}
  *{box-sizing:border-box}
  body{margin:0;padding:2rem;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
  .nav{display:flex;justify-content:space-between;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:.75rem 0;z-index:20;border-bottom:1px solid var(--line)}
  .btn{background:var(--accent);color:#0b1329;padding:.7rem 1.25rem;text-decoration:none;border-radius:8px;font-weight:700;border:none;cursor:pointer;font-size:.9rem}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid rgba(56,189,248,.4)}
  .btn.danger{background:var(--danger);color:#fff;padding:.45rem .7rem;border-radius:6px;align-self:center}
  .btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .section{background:var(--panel);padding:1.4rem;border-radius:12px;margin-bottom:1.4rem;border:1px solid var(--line)}
  .section h2{margin:0 0 .35rem;color:var(--accent);font-size:1.05rem;text-transform:uppercase;letter-spacing:.05em}
  .item-row{display:flex;gap:1rem;margin-bottom:1rem;align-items:flex-start;flex-wrap:wrap;background:rgba(0,0,0,.25);padding:1rem;border-radius:8px;border-left:3px solid var(--accent)}
  .input-group{display:flex;flex-direction:column;flex:1;min-width:150px}
  label{font-size:.7rem;color:var(--muted);margin-bottom:.3rem;text-transform:uppercase;font-weight:700;letter-spacing:.04em}
  input,select{padding:.6rem;border-radius:6px;border:1px solid #334155;background:var(--panel2);color:#fff;font-size:.9rem;width:100%}
  input[type=checkbox]{width:auto}
  .check{flex-direction:row;align-items:center;gap:.5rem;min-width:210px}
  .check label{margin:0;text-transform:none;font-size:.8rem;color:var(--text);font-weight:600}
  .notice{background:rgba(56,189,248,.09);border-left:3px solid var(--accent);padding:.85rem 1rem;margin-bottom:1rem;font-size:.83rem;color:#cbd5e1;border-radius:0 8px 8px 0}
  .hint{font-size:.7rem;color:var(--muted);margin-top:.25rem;text-transform:none;font-weight:400;letter-spacing:0}
  .backup-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.6rem .85rem;background:var(--panel2);border-radius:8px;margin-bottom:.45rem;font-size:.85rem;flex-wrap:wrap}
  .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--green);color:#052e16;padding:.8rem 1.2rem;border-radius:8px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .toast.err{background:var(--danger);color:#fff}
  @media (max-width:640px){body{padding:1rem}}
  dialog{background:var(--panel);color:var(--text);border:1px solid #334155;border-radius:14px;width:min(950px,95vw);max-height:90vh;padding:1.5rem}
  dialog::backdrop{background:rgba(0,0,0,.75)}
  [hidden]{display:none!important}
  body.wizard-only>.nav,body.wizard-only>.notice,body.wizard-only>#editor{display:none}
</style>
<link rel="stylesheet" href="./theme.css">
<link rel="icon" href="./icons/retirement.svg">
</head>
<body data-page="pensions">
<div class="nav">
  <a href="./index.html" class="btn ghost">Back to dashboard</a>
  <div style="display:flex;gap:.5rem;flex-wrap:wrap">
    <button class="btn ghost" onclick="openWizard()">Setup Wizard</button>
    <input type="file" id="import-file" accept="application/json" hidden onchange="importConfig(event)">
    <button class="btn ghost" onclick="backupNow()">Back up now</button>
    <span id="settings-save-status" class="settings-save-status" role="status">Changes save when you select Save changes.</span>
    <button class="btn" id="save-settings" onclick="save()">Save changes</button>
  </div>
</div>


<h1 id="page-title">Household</h1><div id="editor"></div>
<dialog id="setup-wizard" aria-labelledby="wizard-title">
  <h2 id="wizard-title">Setup Wizard</h2><p id="wizard-progress"></p>
  <div id="wizard-body"></div><p id="wizard-error" role="alert" style="color:#fca5a5"></p>
  <div style="display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap">
    <button class="btn ghost" id="wizard-cancel" onclick="closeWizard()">Cancel</button>
    <button class="btn ghost" id="wizard-back" onclick="wizardMove(-1)">Back</button>
    <button class="btn" id="wizard-next" onclick="wizardMove(1)">Next</button>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<link rel="stylesheet" href="./help.css">
<script src="./help.js"></script>
<script src="./planning-core.js"></script>
<script src="./engine.js"></script>
<script src="./comparison-ui.js"></script><script src="./settings-extra.js"></script><script src="./config-ui.js"></script>
</body>
</html>
